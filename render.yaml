services:
  - type: web
    name: watchdog-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: TRUST_PROXY
        value: "2"
      - key: COOKIE_SAMESITE
        value: lax

  - type: web
    name: watchdog-demo-target
    runtime: node
    plan: free
    region: singapore
    rootDir: demo-target
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
